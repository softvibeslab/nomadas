# NomadShift Platform - Render Deployment Configuration
# https://render.com

services:
  # API Web Service
  - type: pserv
    name: nomadas-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: nomadas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomadas-redis
          property: connectionString
      - key: JWT_SECRET
        generate: true
      - key: JWT_REFRESH_SECRET
        generate: true
      - key: FRONTEND_URL
        sync: false

databases:
  # PostgreSQL Database
  - name: nomadas-db
    databaseName: nomadas
    user: nomadas_admin
    plan: starter # 90 days free, then $7/mo

  # Redis Cache
  - name: nomadas-redis
    plan: starter # 90 days free, then $5/mo
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Only allow internal connections
